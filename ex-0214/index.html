const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,t)=>a+(b-a)*t;
const p=(t,a,b)=>clamp((t-a)/(b-a));
const eIO=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
const eOut=x=>1-Math.pow(1-x,3);
const eIn=x=>x*x*x;
const eBack=x=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
// damped spring kick: 0 at start, rings out
const kick=(t,t0,dur=.45,f=2.2)=>{const x=t-t0;if(x<0||x>dur*2)return 0;return Math.exp(-x*7/dur)*Math.sin(x*Math.PI*2*f/dur*0.5)};
// keyframe interpolation with easing
function kf(t,keys,ease=eIO){ // keys: [[time,value],...]
  if(t<=keys[0][0])return keys[0][1];
  for(let i=0;i<keys.length-1;i++){const [t0,v0]=keys[i],[t1,v1]=keys[i+1];
    if(t<=t1){const x=ease((t-t0)/(t1-t0));return Array.isArray(v0)?v0.map((v,j)=>lerp(v,v1[j],x)):lerp(v0,v1,x)}}
  return keys[keys.length-1][1];
}

 ["Повідомл.","💬","linear-gradient(#5fd068,#2fae46)",1],["Пошта","✉️","linear-gradient(#5aa9ff,#1f6fe0)"],["Chess.com","♟","",0,"chessIcon"],["Книги","📚","linear-gradient(#ffad4a,#f07f12)"],

  const light=(f+r)%2===1; const col=light?"var(--light)":"var(--dark)", tc=light?"var(--dark)":"var(--light)";

"RNBQKBNR".split("").forEach((k,i)=>{start.push({id:"w"+k+i,c:"w",k,f:i,r:1});start.push({id:"b"+k+i,c:"b",k,f:i,r:8});});
for(let i=0;i<8;i++){start.push({id:"wP"+i,c:"w",k:"P",f:i,r:2});start.push({id:"bP"+i,c:"b",k:"P",f:i,r:7});}
$("pieces").innerHTML=start.map(s=>`<div class="piece ${s.c}" id="${s.id}">${G[s.k]}</div>`).join("");
const sqXY=(f,r)=>[f*SQ,(8-r)*SQ];

// moves: time, piece id, from, to, classification
const MOVES=[
 {t:8.55, id:"wP5", from:[5,2], to:[5,3], san:"1. f3", cls:"?!", clsC:"#f7c631", who:"Ти", q:"«Ні. А що?»"},
 {t:10.15,id:"bP4", from:[4,7], to:[4,5], san:"1… e5", cls:"", who:"Вона", q:"«Просто згадала нас…»"},
 {t:11.75,id:"wP6", from:[6,2], to:[6,4], san:"2. g4", cls:"??", clsC:"#ca3431", who:"Ти", q:"«Я теж сумую 🥺»"},
 {t:13.25,id:"bQ3", from:[3,8], to:[7,4], san:"2… Фh4#", cls:"#", clsC:"#ca3431", who:"Вона", q:"«Ой. Це було не тобі 💀»"},
];
const MD=.38; // move duration
$("moves").innerHTML=MOVES.map((m,i)=>`<span class="mv" id="mv${i}">${m.san}${m.cls&&m.cls!=="#"?`<span style="color:${m.clsC}">${m.cls}</span>`:""}</span>`).join("");
$("review").innerHTML=MOVES.map((m,i)=>`<div class="line" id="ln${i}"><span class="n">${m.san.replace(/^\d+\.\s?/,"").replace("…","")}</span><span class="q"><span class="who">${m.who}:</span> ${m.q}</span>${m.cls?`<span class="c" style="background:${m.clsC}">${m.cls}</span>`:""}</div>`).join("");
$("clsWrap").innerHTML=MOVES.map((m,i)=>m.cls?`<div class="cls" id="cls${i}" style="background:${m.clsC}">${m.cls}</div>`:"").join("");
$("hls").innerHTML=`<div class="hl" id="hlA"></div><div class="hl" id="hlB"></div>`;

function splitWords(el,html){el.innerHTML=html.split(/(<br>)/).map(s=>s==="<br>"?s:s.split(" ").filter(Boolean).map(w=>`<span class="w">${w}</span>`).join(" ")).join("");return [...el.querySelectorAll(".w")];}
const W1=splitWords($("cap1"),'Коли колишня<br>пише о <span class="acc">02:14</span> 💀'.replace('<span class="acc">02:14</span>','§'));
// re-insert accent
W1.forEach(w=>{if(w.textContent==="§"){w.innerHTML='02:14';w.classList.add("acc")}});
const W2=splitWords($("cap2"),'Розбираємо переписку<br>як <b>§</b> партію');
W2.forEach(w=>{if(w.textContent.includes("§")){w.innerHTML='шахову';w.classList.add("acc")}});
const W3=splitWords($("cap3"),'Два зівки.<br>Один мат.<br>І знову ти §');
W3.forEach(w=>{if(w.textContent.includes("§")){w.innerHTML='програв';w.classList.add("accR")}});
const WQ=splitWords($("ctaQ"),'А ти що<br>зробив би?');
const WW=splitWords($("ctaW"),'Пиши цифру<br>в коментарях ♟️');

function wordsIn(ws,t,t0,step=.09,dur=.4,out=null){
  ws.forEach((w,i)=>{const x=p(t,t0+i*step,t0+i*step+dur);const e=eBack(x);
    let o=clamp(x*2.2), y=(1-e)*70, s=.6+.4*e, r=(1-e)*(i%2?6:-6);
    if(out){const xo=p(t,out,out+.3);o*=1-xo;y-=eIn(xo)*60;s*=1-xo*.15}
    w.style.opacity=o;w.style.transform=`translateY(${y}px) scale(${s}) rotate(${r}deg)`;});
}

/* grain */
const gc=$("grain").getContext("2d");
function grain(frame){let s=frame*9301+49297;const rnd=()=>(s=(s*233280+49297)%2147483647)/2147483647;
  const img=gc.createImageData(540,960);for(let i=0;i<img.data.length;i+=4){const v=rnd()*255;img.data[i]=img.data[i+1]=img.data[i+2]=v;img.data[i+3]=255}gc.putImageData(img,0,0);}

/* ---------- master seek ---------- */
const sceneUI=["cap1","cap2","cap3","ctaShade","ctaQ","opt1","opt2","ctaW"];
function seek(t){
  const frame=Math.round(t*30);
  // ---- camera (whole room + stage) ----
  const drift=[Math.sin(t*.55)*5+Math.sin(t*1.13+1)*3, Math.sin(t*.43+2)*4+Math.sin(t*.97)*2, Math.sin(t*.37)*.35];
  // global camera zoom keys
  const camS=kf(t,[[0,1.0],[3.9,1.07],[4.9,1.0],[7.8,1.03],[8.4,1.42],[13.2,1.5],[13.75,1.3],[15.0,1.32],[15.7,1.0],[20,1.03]]);
  const camY=kf(t,[[0,0],[7.8,0],[8.4,-120],[13.2,-150],[13.75,260],[15,270],[15.7,0],[20,0]]);
  const ac=kick(t,0.45,.5)*.025 + kick(t,13.3,.6)*.06 + kick(t,11.8,.5)*.02 + kick(t,6.1,.5)*.015;
  const camT=`translate(${drift[0]}px,${drift[1]+camY}px) rotate(${drift[2]}deg) scale(${camS*(1+ac)})`;
  $("room").style.transform=camT+` scale(${1+ (camS-1)*-0.6})`;
  $("stage").style.transform=camT;$("stage").style.transformOrigin="50% 50%";

  // ---- phone pose ----
  const pose=kf(t,[
     [0,   [1090, 58,-14, 0.80, 0]],
     [3.95,[1080, 54,-12, 0.84, 0]],
     [4.85,[ 950,  6, -2, 1.10,1]],
     [8.0, [ 950,  4, -1, 1.10,1]],
     [15.0,[ 950,  4, -1, 1.10,1]],
     [15.7,[1400, 8, -2, 0.80,1]],
     [20,  [1390, 7, -1.5, 0.82,1]]
  ]);
  const [py,rx,rz,ps,held]=pose;
  const breathe=held*(Math.sin(t*1.7)*4);
  $("phoneWrap").style.transform=`translate3d(0,${py+breathe}px,0) rotateX(${rx+Math.sin(t*1.3)*held*.6}deg) rotateZ(${rz+Math.sin(t*.9)*held*.5}deg) scale(${ps})`;
  $("phoneShadow").style.opacity=1-held*0.6;
  $("phoneShadow").style.transform=`translateZ(-40px) translate(${held*20}px,${held*30}px)`;

  // hands (rise with the lift)
  const hIn=eOut(p(t,3.95,4.75));
  $("handBack").style.opacity=hIn;
  $("handBack").style.transform=`translateY(${(1-hIn)*500}px)`;
  // build fingers once
  if(!$("palm").dataset.b){$("palm").dataset.b=1;let h="";
    [[300,150],[300,250],[296,350],[290,445]].forEach(([x,y],i)=>{h+=`<div class="finger skin" style="left:${x}px;top:${y-850}px;height:${200-i*14}px;transform:rotate(${-70+i*4}deg);transform-origin:0 50%"></div>`});
    $("handBack").insertAdjacentHTML("beforeend",h.replace(/left:(\d+)px;top:(-?\d+)px/g,(m,a,b)=>`left:${+a-40}px;top:${+b+600}px`));
    $("handBack").insertAdjacentHTML("beforeend",'<div id="thumb"></div>');}

  // ---- screen states ----
  const on=t<0.42?0:kf(t,[[0.42,0],[0.6,1]],eOut);
  $("screenOff").style.opacity=1-on;
  $("spill").style.opacity=on*(1-held*0.45)*(0.9+Math.sin(t*3)*0.03);
  // lockscreen slide (unlock)
  const un=eIO(p(t,4.95,5.4));
  $("lock").style.transform=`translateY(${-un*1200}px)`;
  $("lock").style.opacity=1-un*0.5;
  $("lock").style.display=un>=1?"none":"block";
  const nIn=eBack(p(t,0.45,0.85));
  $("notif").style.transform=`translateY(${(1-nIn)*-160}px) scale(${.85+.15*nIn})`;
  $("notif").style.opacity=clamp(nIn*1.5);
  $("home").style.transform=`scale(${1.08-0.08*un})`;
  // tap on chess icon
  const ic=$("chessIcon").querySelector(".t");
  const press=kf(t,[[5.75,1],[5.85,.86],[6.05,1]]);
  ic.style.transform=`scale(${press})`;
  const icR={x:38+ (548-76)/4*2.5, y:130+ 3*0+ (104+36+31)*2 + 52};
  const rp=p(t,5.8,6.2);
  $("ripple").style.left=icR.x+"px";$("ripple").style.top=icR.y+"px";
  $("ripple").style.opacity=(rp>0&&rp<1)?(1-rp)*.8:0;
  $("ripple").style.transform=`scale(${.3+rp*1.6})`;
  // thumb travels: swipe up at 4.95, then tap chess icon at 5.8
  const thumbVis=kf(t,[[4.6,0],[4.8,1],[6.0,1],[6.25,0]],eOut)*(t<15?1:0);
  const thX=kf(t,[[4.6,120],[4.95,20],[5.4,40],[5.75,icR.x-290-14],[6.2,icR.x-200]]);
  const thY=kf(t,[[4.6,700],[4.95,520],[5.4,180],[5.75,icR.y-600-30],[6.2,icR.y-420]]);
  const thZ=kf(t,[[5.7,1.08],[5.8,.96],[5.95,1.08]]);
  $("thumbTip").style.opacity=thumbVis;
  $("thumbTip").style.transform=`translate(${thX}px,${thY}px) rotate(-28deg) scale(${thZ})`;

  // app open
  const ao=eOut(p(t,5.95,6.4));
  $("app").style.display=t<5.95?"none":"block";
  $("app").style.transformOrigin=`${icR.x}px ${icR.y}px`;
  $("app").style.transform=`scale(${.18+.82*ao})`;
  $("app").style.opacity=clamp(ao*2);
  $("app").style.borderRadius=(1-ao)*60+"px";

  // ---- chess ----
  const pos={};start.forEach(s=>pos[s.id]=[s.f,s.r]);
  let lift={};
  MOVES.forEach((m,i)=>{const x=eIO(p(t,m.t,m.t+MD));
    const f=lerp(m.from[0],m.to[0],x), r=lerp(m.from[1],m.to[1],x);
    pos[m.id]=[f,r]; if(x>0&&x<1)lift[m.id]=Math.sin(x*Math.PI);});
  start.forEach(s=>{const [f,r]=pos[s.id];const [x,y]=sqXY(f,r);const l=lift[s.id]||0;
    const el=$(s.id);el.style.transform=`translate(${x}px,${y-l*10}px) scale(${1+l*.14})`;el.style.zIndex=l?10:1;
    el.style.filter=l?`drop-shadow(0 ${8*l}px 6px rgba(0,0,0,.45))`:"none";});
  // last move highlight
  let last=-1;MOVES.forEach((m,i)=>{if(t>=m.t)last=i});
  if(last>=0){const m=MOVES[last];const a=sqXY(...m.from),b=sqXY(...m.to);
    $("hlA").style.display=$("hlB").style.display="block";
    $("hlA").style.transform=`translate(${a[0]}px,${a[1]}px)`;$("hlB").style.transform=`translate(${b[0]}px,${b[1]}px)`;}
  else $("hlA").style.display=$("hlB").style.display="none";
  // classification badges
  MOVES.forEach((m,i)=>{const el=$("cls"+i);if(!el)return;const x=eBack(p(t,m.t+MD,m.t+MD+.3));const [bx,by]=sqXY(...m.to);
    el.style.opacity=clamp(x*2);el.style.transform=`translate(${bx+40}px,${by-14}px) scale(${x})`;
    el.style.display=t<m.t?"none":"flex";});
  // mate king glow
  const mate=p(t,13.25+MD,13.25+MD+.25);
  const kxy=sqXY(4,1);$("kingRed").style.transform=`translate(${kxy[0]}px,${kxy[1]}px) scale(${1+kick(t,13.65,.5)*.25})`;
  $("kingRed").style.opacity=mate;
  // king wobble / topple slightly
  const kk=$("wK4");if(mate>0){kk.style.transform+=` rotate(${eOut(mate)*-14+Math.sin(t*14)*kick(t,13.65,.5)*6}deg)`;}
  // move list and review lines
  MOVES.forEach((m,i)=>{const show=t>=m.t+.1;const mv=$("mv"+i);mv.style.opacity=show?1:0;mv.classList.toggle("cur",i===last);
    const ln=$("ln"+i);const x=eBack(p(t,m.t+MD,m.t+MD+.35));
    // stack: newest at top of review area; show only last 2
    const age=last-i; const slot=age;
    ln.style.top=(slot*96)+"px";
    const vis=t>=m.t+MD && age<=1;
    ln.style.opacity=vis?clamp(x*2)*(age===1?.55:1):0;
    ln.style.transform=`translateY(${(1-x)*30}px) scale(${.92+.08*x})`;});
  // clocks
  const clk=s=>{s=Math.max(0,Math.floor(s));return Math.floor(s/60)+":"+String(s%60).padStart(2,"0")};
  let wT=179-Math.max(0,Math.min(t,8.55)-6.4)*1-Math.max(0,Math.min(t,11.75)-10.5)*1;
  const bT=167-Math.max(0,Math.min(t,10.15)-8.9)-Math.max(0,Math.min(t,13.25)-12.1);
  $("clkW").textContent=clk(wT);$("clkB").textContent=clk(bT);
  const wTurn=(t<8.55)||(t>=10.15&&t<11.75);
  $("clkW").classList.toggle("on",wTurn&&t<13.6);$("clkB").classList.toggle("on",!wTurn&&t<13.6);
  // tap circles for white's moves
  let tp=0,tx=0,ty=0;
  MOVES.forEach(m=>{if(m.id[0]!=="w")return;[[m.t-.35,m.from],[m.t,m.to]].forEach(([tt,sq])=>{const x=p(t,tt,tt+.3);if(x>0&&x<1){tp=1-x;const [a,b]=sqXY(...sq);tx=a+14+32.5;ty=b+268+32.5;}})});
  $("tap").style.opacity=tp*.9;$("tap").style.left=tx+"px";$("tap").style.top=ty+"px";$("tap").style.transform=`scale(${1.3-tp*.5})`;
  // mate card
  const mc=eBack(p(t,13.85,14.25));
  $("mateCard").style.opacity=clamp(mc*2);
  $("mateCard").style.transform=`translateY(${(1-mc)*80}px) scale(${.9+.1*mc})`;
  // flash on mate
  $("flash").style.opacity=Math.max(0,1-p(t,13.62,14.4))*(t>=13.62?1:0)*.9;

  // ---- captions ----
  $("cap1").style.display=t<4.4?"block":"none";
  wordsIn(W1,t,0.55,.11,.42,3.95);
  $("cap2").style.display=(t>6.2&&t<8.6)?"block":"none";
  wordsIn(W2,t,6.35,.1,.42,8.15);
  $("shTop").style.opacity=Math.max(kf(t,[[6.2,0],[6.5,1],[8.2,1],[8.6,0]],eIO)*(t<9?1:0), kf(t,[[13.45,0],[13.7,1],[14.9,1],[15.3,0]],eIO)*(t>13?1:0));
  $("cap3").style.display=(t>13.5&&t<15.3)?"block":"none";
  wordsIn(W3,t,13.7,.12,.4,14.9);
  const cs=p(t,15.0,15.5);
  $("ctaShade").style.opacity=cs;
  $("ctaQ").style.display=t>15?"block":"none";
  wordsIn(WQ,t,15.25,.1,.45);
  [["opt1",16.2],["opt2",16.65]].forEach(([id,t0],i)=>{const x=eBack(p(t,t0,t0+.45));const el=$(id);
    el.style.opacity=clamp(x*2);el.style.transform=`translateX(${(1-x)*(i?260:-260)}px) rotate(${(1-x)*(i?4:-4)+Math.sin(t*2+i)*.6}deg) scale(${1+kick(t,t0+.3,.4)*.04})`;});
  $("ctaW").style.display=t>17.3?"block":"none";
  wordsIn(WW,t,17.5,.1,.45);
  // gentle pulse on the "♟️" CTA line
  if(t>18.4)$("ctaW").style.transform=`scale(${1+Math.sin((t-18.4)*5)*.02})`;else $("ctaW").style.transform="none";

  grain(frame);
}
window.__seek=seek;
const q=new URLSearchParams(location.search);
if(q.has("t"))seek(+q.get("t"));
else if(!q.has("render")){const t0=performance.now();(function loop(){seek(((performance.now()-t0)/1000)%20);requestAnimationFrame(loop)})();}
</script>
